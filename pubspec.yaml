name: docuchat
description: "DocuChat - Talk to Any PDF"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  file_picker: ^10.3.0
  syncfusion_flutter_pdf: ^35.1.37
  google_mlkit_text_recognition: ^0.15.0
  http: ^1.6.0
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  google_sign_in: ^7.2.0
  sqflite: ^2.4.4+1
  path: ^1.9.1
  cloud_firestore: ^6.10.0
  image_picker: ^1.2.4
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/logo.png"

flutter:
  uses-material-design: true

  assets:
    - assets/logo.png